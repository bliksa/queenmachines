<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Queen Machines - Fighter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <div class="player-info player1-info">
                <div class="player-name">PLAYER 1</div>
                <div class="health-bar-container">
                    <div class="health-bar" id="health-bar-p1"></div>
                </div>
            </div>
            <div class="round-info">
                <div class="round-text" id="round-text">ROUND 1</div>
                <div class="timer" id="timer">99</div>
            </div>
            <div class="player-info player2-info">
                <div class="player-name">PLAYER 2</div>
                <div class="health-bar-container">
                    <div class="health-bar" id="health-bar-p2"></div>
                </div>
            </div>
        </div>
        
        <canvas id="gameCanvas" width="800" height="450"></canvas>
        
        <div class="game-footer">
            <div class="controls-info">
                <div class="control-section">
                    <h3>Player 1 Controls</h3>
                    <p>W: Jump | S: Crouch | A: Left | D: Right</p>
                    <p>J: Punch | K: Kick | L: Block</p>
                </div>
                <div class="control-section">
                    <h3>Player 2 Controls</h3>
                    <p>↑: Jump | ↓: Crouch | ←: Left | →: Right</p>
                    <p>1: Punch | 2: Kick | 3: Block</p>
                </div>
            </div>
        </div>
        
        <div class="game-message" id="game-message"></div>
    </div>
    
    <script src="game.js"></script>
</body>
</html>
